spring.application.name=backend
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.flyway.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
# Cognito user pool. Blank values make the API reject every token (fail closed). Set per environment.
pritimitra.auth.cognito.issuer=${COGNITO_ISSUER:}
pritimitra.auth.cognito.region=${AWS_REGION:ap-south-1}
pritimitra.auth.cognito.client-ids=${COGNITO_CLIENT_IDS:}
# Legal document versions. Local drafts are clearly labelled. Production requires approved versions and https URLs.
pritimitra.legal.terms-version=${PRITIMITRA_TERMS_VERSION:terms-draft-v1}
pritimitra.legal.privacy-version=${PRITIMITRA_PRIVACY_VERSION:privacy-draft-v1}
pritimitra.legal.terms-url=${PRITIMITRA_TERMS_URL:}
pritimitra.legal.privacy-url=${PRITIMITRA_PRIVACY_URL:}
pritimitra.legal.require-approved=${PRITIMITRA_LEGAL_REQUIRE_APPROVED:true}
# Cognito user pool ID is needed for administrative deletion during retention purge.
pritimitra.auth.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
# Underage registration attempts are purged after this many days, and their Cognito identity is deleted.
pritimitra.retention.ineligible-account-days=${PRITIMITRA_INELIGIBLE_RETENTION_DAYS:30}
pritimitra.retention.purge-cron=${PRITIMITRA_PURGE_CRON:0 17 3 * * *}
# Profile photos. Uploads are rejected when the bucket is blank (fail closed with 503). Bucket must be private, SSE enabled, no public access.
pritimitra.photos.bucket=${PRITIMITRA_PHOTO_BUCKET:}
pritimitra.photos.region=${AWS_REGION:ap-south-1}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
management.endpoints.web.exposure.include=health,info
