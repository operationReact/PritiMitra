name: Web browser acceptance

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why browser acceptance is required"
        required: true
        type: choice
        options:
          - auth-routing
          - responsive-shell
          - phase-boundary
          - release-candidate
      ref:
        description: "Git ref/SHA to validate; leave blank for selected branch"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: web-browser-${{ inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  browser-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install pinned browser test runner without changing application lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.64.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pritimitra-web-browser-failures
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
          retention-days: 5
