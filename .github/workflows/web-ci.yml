name: Web fast CI

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build

# Full Playwright/browser acceptance is intentionally separated into
# web-browser-acceptance.yml and is required for auth/routing/material responsive
# changes, phase boundaries and release candidates according to the CI policy.
