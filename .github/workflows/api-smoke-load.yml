name: Non-production API smoke load test

on:
  push:
    branches: [main]
    paths: ["perf/k6/**", ".github/workflows/api-smoke-load.yml"]
  pull_request:
    paths: ["perf/k6/**", ".github/workflows/api-smoke-load.yml"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment (production is intentionally unsupported)"
        type: choice
        required: true
        options:
          - staging
          - local
      base_url:
        description: "API origin, e.g. https://api.staging.example.test or http://127.0.0.1:8080"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: api-smoke-${{ inputs.target_env }}
  cancel-in-progress: false

jobs:
  target-validation:
    name: Test non-production target guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run target-guard unit tests
        run: node --test perf/k6/target.test.mjs

  smoke:
    if: github.event_name == 'workflow_dispatch'
    needs: target-validation
    name: Guarded API smoke load test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      K6_TARGET_ENV: ${{ inputs.target_env }}
      K6_BASE_URL: ${{ inputs.base_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up k6
        uses: grafana/setup-k6-action@v1

      - name: Validate target and run low-intensity smoke test
        run: k6 run perf/k6/smoke.js
