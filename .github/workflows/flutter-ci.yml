name: Flutter mobile CI

on:
  push:
    paths: ["mobile/**", ".github/workflows/flutter-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/flutter-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=show lib/core/theme/app_theme.dart lib/features/welcome/presentation/welcome_screen.dart test/widget_test.dart
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
      - name: Compile Android release APK
        run: flutter build apk --release
      - name: Compile Android Play Store App Bundle
        run: flutter build appbundle --release

  ios-release-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - name: Resolve Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Compile iOS release build without signing
        working-directory: mobile
        run: flutter build ios --release --no-codesign
