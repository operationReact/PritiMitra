name: Flutter fast CI

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/flutter-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/flutter-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Flutter Web release build
        run: flutter build web --release

# Android/iOS release compilation is intentionally not part of routine PR CI.
# Use flutter-native-acceptance.yml for native-sensitive changes, phase boundaries,
# and release candidates as required by docs/engineering/ci-cost-control-policy.md.
