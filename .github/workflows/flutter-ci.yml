name: Flutter fast CI

on:
  push:
    branches: [main]
    paths: ["mobile/**", ".github/workflows/flutter-ci.yml"]
  pull_request:
    paths: ["mobile/**", ".github/workflows/flutter-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-fast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  flutter-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.8"
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting for changed Dart files
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
          else
            base_sha="${{ github.event.before }}"
            head_sha="${{ github.sha }}"
          fi

          mapfile -t changed < <(
            git diff --name-only --diff-filter=ACMR "$base_sha" "$head_sha" -- \
              ':(glob)mobile/lib/**/*.dart' \
              ':(glob)mobile/test/**/*.dart' \
            | sed 's#^mobile/##'
          )

          if (( ${#changed[@]} == 0 )); then
            echo "No changed Dart files; formatting check skipped."
            exit 0
          fi

          dart format --output=none --set-exit-if-changed "${changed[@]}"
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Flutter Web release build
        run: flutter build web --release

# Android/iOS release compilation is intentionally not part of routine PR CI.
# Use flutter-native-acceptance.yml for native-sensitive changes, phase boundaries,
# and release candidates as required by docs/engineering/ci-cost-control-policy.md.
