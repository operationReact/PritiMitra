name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", "infra/**", "AGENTS.md", ".gitignore", ".github/workflows/backend-ci.yml", ".github/copilot-instructions.md", "docs/engineering/**"]
  pull_request:
    paths: ["backend/**", "infra/**", "AGENTS.md", ".gitignore", ".github/workflows/backend-ci.yml", ".github/copilot-instructions.md", "docs/engineering/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate local PostgreSQL Compose configuration
        run: docker compose --env-file ../infra/.env.example -f ../infra/docker-compose.yml config --quiet
      # Testcontainers starts PostgreSQL 17 through the runner's Docker daemon.
      - name: Maven verify
        run: sh mvnw -B verify
