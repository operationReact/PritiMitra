name: Backend CI

on:
  push:
    paths: ["backend/**", "infra/**", "AGENTS.md", ".gitignore", ".github/workflows/backend-ci.yml", ".github/copilot-instructions.md"]
  pull_request:
    paths: ["backend/**", "infra/**", "AGENTS.md", ".gitignore", ".github/workflows/backend-ci.yml", ".github/copilot-instructions.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Validate local PostgreSQL Compose configuration
        run: docker compose --env-file ../infra/.env.example -f ../infra/docker-compose.yml config --quiet
      # Testcontainers starts PostgreSQL 17 through the runner's Docker daemon.
      - run: sh mvnw -B verify
